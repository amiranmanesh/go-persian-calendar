name: Holidays

on:
  schedule:
    # Monthly, a few days into the Gregorian month, so late corrections land.
    - cron: "17 3 4 * *"
  workflow_dispatch:
    inputs:
      from:
        description: First Persian year to reconcile
        default: "1390"
      to:
        description: Last Persian year to reconcile
        default: "1430"

permissions:
  contents: read

jobs:
  reconcile:
    name: reconcile holiday data
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          check-latest: true

      - name: Reconcile
        env:
          FROM: ${{ github.event.inputs.from || '1390' }}
          TO: ${{ github.event.inputs.to || '1430' }}
        run: |
          case "$FROM$TO" in
            *[!0-9]*) echo "::error::years must be numeric"; exit 1 ;;
          esac

          go run ./holiday/internal/gen -from "$FROM" -to "$TO" -out holiday/data/iran.json

      - name: Publish the same file on the site
        run: cp holiday/data/iran.json docs/data/v1/iran.json

      - name: Verify the package still agrees with itself
        run: go test ./holiday/... -count=1

      - name: Summarise the change
        id: diff
        run: |
          if git diff --quiet -- holiday/data docs/data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change in the holiday data."
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

          {
            echo "The reconciler found differences between the computed calendar and the reference."
            echo
            echo '```diff'
            git diff --unified=1 -- holiday/data | head -c 8000
            echo '```'
            echo
            echo "Review each moved date before merging: a wrong holiday is worse than a missing one."
          } > pr-body.md

      - name: Open a pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: holidays/reconcile
          title: "data: reconcile the holiday calendar"
          body-path: pr-body.md
          commit-message: |
            data: reconcile the holiday calendar

            Regenerated by .github/workflows/holidays.yml.
          labels: data
          delete-branch: true
