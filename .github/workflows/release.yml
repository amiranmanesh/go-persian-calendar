name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, for example v1.4.0
        required: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          check-latest: true
      - run: go build ./...
      - run: go test ./... -race
      - run: make lint

  release:
    name: publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve and validate the tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_TAG: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-$REF_TAG}"

          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::refusing to release a tag that is not vMAJOR.MINOR.PATCH: $tag"; exit 1 ;;
          esac

          echo "name=$tag" >> "$GITHUB_OUTPUT"

      - name: Extract the changelog section
        id: notes
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          version="${TAG#v}"

          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { capture = 1; next }
            capture && /^## \[/          { exit }
            capture                      { print }
          ' CHANGELOG.md > release-notes.md

          if [ -s release-notes.md ]; then
            echo "generated=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::no CHANGELOG section for $version, using generated notes"
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
          GENERATED: ${{ steps.notes.outputs.generated }}
        run: |
          if [ "$GENERATED" = "true" ]; then
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          else
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag
          fi

      - name: Warm the module proxy
        env:
          TAG: ${{ steps.tag.outputs.name }}
          REPOSITORY: ${{ github.repository }}
        run: GOPROXY=proxy.golang.org go list -m "github.com/$REPOSITORY@$TAG" || true
